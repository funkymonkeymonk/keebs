# Corne Dongle Configuration for MDBT50Q-CX
# This config applies when building for the nrf52840dongle_nrf52840 board

# Power management (dongle can use more aggressive sleep)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=15000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Bluetooth - Central role settings
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB - Dongle is USB-connected
CONFIG_ZMK_USB=y

# Disable DCDC for MDBT50Q-CX compatibility (per Raytac docs)
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# Logging (optional - disable for production)
# CONFIG_ZMK_USB_LOGGING=y

# Combo support
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=4
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4
